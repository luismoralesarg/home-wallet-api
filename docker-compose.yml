# Desarrollo: Postgres + migraciones + API.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet"]
      interval: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.17.1
    command: ["-path=/migrations", "-database=postgres://wallet:wallet@db:5432/wallet?sslmode=disable", "up"]
    volumes: ["./migrations:/migrations:ro"]
    depends_on:
      db: { condition: service_healthy }

  api:
    build: .
    environment:
      DATABASE_URL: postgres://wallet:wallet@db:5432/wallet?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please}
      PORT: "8080"
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
